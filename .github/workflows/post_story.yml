name: Post Daily Story

on:
  schedule:
    - cron: '0 1 * * *'  # 8am WIB = 1am UTC
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - run: pip install playwright

      - run: playwright install chromium

      - run: python post_story.py
        env:
          IG_COOKIES: ${{ secrets.IG_COOKIES }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: "*.png"